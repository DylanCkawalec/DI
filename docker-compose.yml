# 🚀 ERC-8004 Trustless AI - Final Docker Compose for Phala TEE
# =============================================================
# Complete production deployment with Phala Cloud integration
#
# REQUIRED: Create .env file with these variables:
# - RPC_URL (Base Sepolia RPC endpoint)
# - PRIVATE_KEY (Your deployment wallet)
# - PHALA_API_KEY (Your Phala TEE API key)
# - GROK_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
# - IDENTITY_REGISTRY_ADDRESS, REPUTATION_REGISTRY_ADDRESS, VALIDATION_REGISTRY_ADDRESS
# - ETHERSCAN_API_KEY, NEXT_PUBLIC_* variables
#
# Usage: cp env.production.template .env && docker-compose up -d

version: '3.8'

services:
  # Main ERC-8004 A2A Application
  erc8004-trustless-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: erc8004-trustless-ai:latest
    container_name: erc8004-complete
    
    # Environment configuration
    environment:
      # Production settings
      - NODE_ENV=production
      - TEE_MODE=production
      - PHALA_DEPLOYMENT=true
      
      # Blockchain configuration
      - RPC_URL=${RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CHAIN_ID=${CHAIN_ID:-84532}
      
      # ERC-8004 contract addresses
      - IDENTITY_REGISTRY_ADDRESS=${IDENTITY_REGISTRY_ADDRESS}
      - REPUTATION_REGISTRY_ADDRESS=${REPUTATION_REGISTRY_ADDRESS}
      - VALIDATION_REGISTRY_ADDRESS=${VALIDATION_REGISTRY_ADDRESS}
      
      # AI model configuration
      - GROK_API_KEY=${GROK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Phala TEE configuration
      - PHALA_API_KEY=${PHALA_API_KEY}
      - TEE_ATTESTATION_ENABLED=true
      - PHALA_ENDPOINT=https://api.phala.network
      - DSTACK_SIMULATOR_ENDPOINT=http://phala-tee:8090
      
      # Frontend configuration
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_VALIDATOR_URL=http://localhost:8081
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL}
      - NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID:-84532}
      - NEXT_PUBLIC_IDENTITY_REGISTRY=${NEXT_PUBLIC_IDENTITY_REGISTRY}
      - NEXT_PUBLIC_VALIDATION_REGISTRY=${NEXT_PUBLIC_VALIDATION_REGISTRY}
      - NEXT_PUBLIC_ETHERSCAN_API_KEY=${NEXT_PUBLIC_ETHERSCAN_API_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
    
    # Port mapping
    ports:
      - "3000:3000"    # Frontend
      - "8080:8080"    # A2A API Server
      - "8081:8081"    # Validator Agent
    
    # Volume mounts
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./validations:/app/validations
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Secure environment file mounting (optional - env vars preferred)
      - ./.env:/app/.env:ro
    
    # Network configuration
    networks:
      - erc8004-network
    
    # Dependencies
    depends_on:
      phala-tee:
        condition: service_healthy
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    
    # Health check
    healthcheck:
      test: |
        curl -f http://localhost:8080/api/health &&
        curl -f http://localhost:8081/health &&
        curl -f http://localhost:3000
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # Phala TEE Integration Service
  phala-tee:
    image: phalanetwork/dstack-simulator:latest
    container_name: erc8004-phala-tee
    
    environment:
      - PHALA_API_KEY=${PHALA_API_KEY}
      - TEE_MODE=production
      - DSTACK_SIMULATOR_PORT=8090
      - RUST_LOG=info
    
    ports:
      - "8090:8090"
    
    volumes:
      - phala_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    networks:
      - erc8004-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Named volumes
volumes:
  phala_data:
    driver: local
    labels:
      description: "Phala TEE data storage"

# Network configuration
networks:
  erc8004-network:
    driver: bridge
    labels:
      description: "ERC-8004 A2A Network"

# Labels for Phala CLI integration
labels:
  - "phala.enabled=true"
  - "phala.tee=required"
  - "phala.project=erc8004-trustless-ai"
  - "phala.version=1.0.0"
