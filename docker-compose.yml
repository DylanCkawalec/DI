version: '3.8'

services:
  # Complete ERC-8004 A2A System with PHALA TEE Integration
  erc8004-complete:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: erc8004-a2a:production
    container_name: erc8004-complete-system
    
    environment:
      # Complete System Configuration
      - NODE_ENV=production
      - TEE_MODE=production
      - PHALA_DEPLOYMENT=true
      - GRANT_SUDO=yes
      
      # Blockchain Configuration  
      - RPC_URL=${RPC_URL:-https://lb.drpc.org/base-sepolia/ArTAkftTl0UdjDU4KTEz4ohhAEm9iRER8IileqhnKxixj}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CHAIN_ID=${CHAIN_ID:-84532}
      
      # ERC-8004 Contract Addresses
      - IDENTITY_REGISTRY_ADDRESS=${IDENTITY_REGISTRY_ADDRESS:-0x35656CaD817aD468260dE1bA029fF919E5a40f75}
      - REPUTATION_REGISTRY_ADDRESS=${REPUTATION_REGISTRY_ADDRESS:-0x5796Cf09CF7E0F27A6Fb1489a7e5f9414f95F17B}
      - VALIDATION_REGISTRY_ADDRESS=${VALIDATION_REGISTRY_ADDRESS:-0x6731b3be764B33a4E94D148410f1f551CE91dA61}
      
      # AI Configuration
      - GROK_API_KEY=${GROK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Etherscan Integration
      - NEXT_PUBLIC_ETHERSCAN_API_KEY=EF32MAFD3I58N92X1DP2637731ZANQ2ADG
      - ETHERSCAN_API_KEY=EF32MAFD3I58N92X1DP2637731ZANQ2ADG
      
      # Frontend Configuration
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_VALIDATOR_URL=http://localhost:8081
      - NEXT_PUBLIC_RPC_URL=${RPC_URL:-https://lb.drpc.org/base-sepolia/ArTAkftTl0UdjDU4KTEz4ohhAEm9iRER8IileqhnKxixj}
      - NEXT_PUBLIC_CHAIN_ID=${CHAIN_ID:-84532}
      - NEXT_PUBLIC_IDENTITY_REGISTRY=${IDENTITY_REGISTRY_ADDRESS:-0x35656CaD817aD468260dE1bA029fF919E5a40f75}
      - NEXT_PUBLIC_VALIDATION_REGISTRY=${VALIDATION_REGISTRY_ADDRESS:-0x6731b3be764B33a4E94D148410f1f551CE91dA61}
      
      # PHALA TEE Configuration
      - PHALA_API_KEY=${PHALA_API_KEY:-phak_AITHmEg1_xqgbIHi-qqxxGBkyEBWfzfauJJOnnX_MRY}
      - TEE_ATTESTATION_ENABLED=true
      - PHALA_ENDPOINT=https://api.phala.network
      - DSTACK_SIMULATOR_ENDPOINT=https://phat-cluster-api.phala.network
    
    # PHALA TEE and application volumes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dstack.sock:/var/run/dstack.sock
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./validations:/app/validations
    
    # Network configuration - expose all ports
    ports:
      - "3000:3000"    # Frontend Application
      - "8080:8080"    # A2A API Server
      - "8081:8081"    # Validator Agent
    
    # Run as root for TEE and Docker access
    user: root
    
    # Production startup command
    command: ["./prod.sh"]
    
    # Restart policy
    restart: unless-stopped
    
    # Enhanced health check for complete system
    healthcheck:
      test: |
        curl -f http://localhost:8080/api/health &&
        curl -f http://localhost:8081/health &&
        curl -f http://localhost:3000
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    
    # Resource limits for complete system
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # PHALA TEE Integration Service
  phala-tee:
    image: phalanetwork/dstack-simulator:latest
    container_name: erc8004-phala-tee
    
    environment:
      - PHALA_API_KEY=${PHALA_API_KEY:-phak_AITHmEg1_xqgbIHi-qqxxGBkyEBWfzfauJJOnnX_MRY}
      - TEE_MODE=production
      - DSTACK_SIMULATOR_PORT=8090
    
    ports:
      - "8090:8090"  # PHALA TEE Simulator
    
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - phala_data:/app/data
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: erc8004-redis
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring and Logging
  prometheus:
    image: prom/prometheus:latest
    container_name: erc8004-prometheus
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  phala_data:
    driver: local
  app_data:
    driver: local
  session_data:
    driver: local

networks:
  default:
    name: erc8004-network
    driver: bridge