# 🚀 ERC-8004 Trustless AI - Final Docker Compose for Phala TEE
# =============================================================
# Complete production deployment with Phala Cloud integration
#
# REQUIRED: Create .env file with these variables:
# - RPC_URL (Base Sepolia RPC endpoint)
# - PRIVATE_KEY (Your deployment wallet)
# - PHALA_API_KEY (Your Phala TEE API key)
# - GROK_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
# - IDENTITY_REGISTRY_ADDRESS, REPUTATION_REGISTRY_ADDRESS, VALIDATION_REGISTRY_ADDRESS
# - ETHERSCAN_API_KEY, NEXT_PUBLIC_* variables
#
# Usage: cp env.production.template .env && docker-compose up -d

version: '3.8'

services:
  # ERC-8004 Trustless AI Agent - Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dylanckawalec/trustless-ai-erc-8004:latest
    container_name: erc8004-trustless-agent
    
    # Environment configuration for Phala Cloud TEE
    environment:
      # Phala Cloud specific settings
      - AGENT_TYPE=${AGENT_TYPE:-server}
      - CONTAINER_MODE=true
      - NODE_ENV=production
      - TEE_MODE=production
      - PHALA_DEPLOYMENT=true
      - GRANT_SUDO=yes
      - HEALTHCHECK_INTERVAL=30000
      
      # Blockchain configuration
      - RPC_URL=${RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CHAIN_ID=${CHAIN_ID:-84532}
      
      # ERC-8004 contract addresses
      - IDENTITY_REGISTRY_ADDRESS=${IDENTITY_REGISTRY_ADDRESS}
      - REPUTATION_REGISTRY_ADDRESS=${REPUTATION_REGISTRY_ADDRESS}
      - VALIDATION_REGISTRY_ADDRESS=${VALIDATION_REGISTRY_ADDRESS}
      - CONTRACT_ADDRESS=${IDENTITY_REGISTRY_ADDRESS}
      
      # Enhanced AI model configuration
      - GROK_API_KEY=${GROK_API_KEY}
      - XAI_API_KEY=${GROK_API_KEY}  # XAI SDK compatibility
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # AI model selection
      - GROK_FAST_MODEL=${GROK_FAST_MODEL:-grok-3-mini}
      - GROK_STANDARD_MODEL=${GROK_STANDARD_MODEL:-grok-3}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      
      # Phala TEE configuration
      - PHALA_API_KEY=${PHALA_API_KEY}
      - TEE_ATTESTATION_ENABLED=true
      - PHALA_ENDPOINT=https://api.phala.network
      
      # A2A Agent Keys (for multi-agent deployment)
      - SERVER_AGENT_PRIVATE_KEY=${PRIVATE_KEY}
      - VALIDATOR_AGENT_PRIVATE_KEY=${PRIVATE_KEY}
      - CLIENT_AGENT_PRIVATE_KEY=${PRIVATE_KEY}
      - SERVER_AGENT_SALT=${SERVER_AGENT_SALT:-server_salt_001}
      - VALIDATOR_AGENT_SALT=${VALIDATOR_AGENT_SALT:-validator_salt_001}
      - CLIENT_AGENT_SALT=${CLIENT_AGENT_SALT:-client_salt_001}
      
      # Frontend configuration
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_VALIDATOR_URL=http://localhost:8081
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL}
      - NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID:-84532}
      - NEXT_PUBLIC_IDENTITY_REGISTRY=${NEXT_PUBLIC_IDENTITY_REGISTRY}
      - NEXT_PUBLIC_VALIDATION_REGISTRY=${NEXT_PUBLIC_VALIDATION_REGISTRY}
      - NEXT_PUBLIC_ETHERSCAN_API_KEY=${NEXT_PUBLIC_ETHERSCAN_API_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
    
    # Port mapping
    ports:
      - "3000:3000"    # Frontend
      - "8080:8080"    # A2A API Server
      - "8081:8081"    # Validator Agent
    
    # Critical Phala TEE volume mounts
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock   # Phala Cloud TEE socket (dstack v0.5.x)
      - /var/run/tappd.sock:/var/run/tappd.sock     # Phala Cloud TEE socket (dstack < v0.5.x)
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./validations:/app/validations
      - ./.env:/app/.env:ro
    
    # Network configuration
    networks:
      - erc8004-network
    
    # Run as root for Phala Cloud TEE access
    user: root
    
    # Enhanced Phala Cloud startup command
    command: ["./load_env.sh", "./quick_launch.sh"]
    
    # Production restart policy
    restart: unless-stopped
    
    # Enhanced health check for backend services only (avoid disrupting frontend)
    healthcheck:
      test: |
        curl -f http://localhost:8080/api/health &&
        curl -f http://localhost:8081/health
      interval: 60s  # Less frequent checks
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource limits optimized for Phala TEE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G


# Network configuration for Phala Cloud
networks:
  erc8004-network:
    driver: bridge
