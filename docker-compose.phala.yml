version: '3.8'

services:
  app:
    image: dylanckawalec/erc8004-a2a:production
    container_name: erc8004-a2a-phala

    environment:
      NODE_ENV: production
      TEE_MODE: production
      USE_TEE_AUTH: "true"
      # These will be injected securely via Phala Cloud UI/CLI
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      SERVER_AGENT_SALT: ${SERVER_AGENT_SALT}
      VALIDATOR_AGENT_SALT: ${VALIDATOR_AGENT_SALT}

    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

    ports:
      - "8080:8080"  # A2A API Server
      - "8081:8081"  # Validator Agent
      - "3000:3000"  # Frontend

    command: ["./prod.sh"]

    restart: unless-stopped
