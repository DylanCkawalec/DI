# Foundry local template for ERC-8004 registries
# Copy or merge into foundry.toml for local testing with Anvil
# Values are read from your project .env where possible

[profile.local]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
# Optional: set EVM fork/version for consistency
# evm_version = "paris"
# chain_id used when launching local anvil (informational)
chain_id = 31337

# Helpful remappings
remappings = [
  "forge-std/=lib/forge-std/src/"
]

# Allow Foundry cheatcodes limited FS access if needed (tests/scripts)
# Adjust paths as needed. '../.env' is useful if reading config from tests.
fs_permissions = [
  { access = "read", path = "../.env" },
  { access = "read-write", path = "broadcast" },
  { access = "read-write", path = "out" }
]

# RPC endpoints driven by environment variables (from .env)
[rpc_endpoints]
local = "${RPC_URL}"
# Optional other networks
# sepolia = "${SEPOLIA_RPC_URL}"
# base = "${BASE_RPC_URL}"
# base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
# Add keys to .env if you plan to verify
# mainnet = { key = "${ETHERSCAN_API_KEY}" }
# sepolia = { key = "${ETHERSCAN_API_KEY}" }
# base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
# base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

[fmt]
wrap_comments = true
line_length = 120

