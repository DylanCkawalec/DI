# 🚀 PHALA CLOUD TEE DEPLOYMENT CONFIGURATION
# ==============================================
# ERC-8004 Trustless AI Agent-to-Agent Protocol
# Production deployment on Phala Cloud TEE

apiVersion: apps/v1
kind: Deployment
metadata:
  name: erc8004-trustless-ai
  labels:
    app: erc8004-a2a
    version: production
    tee: phala-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erc8004-a2a
  template:
    metadata:
      labels:
        app: erc8004-a2a
        tee-enabled: "true"
    spec:
      containers:
      - name: erc8004-complete
        image: erc8004-a2a:production
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 8080
          name: api-server
        - containerPort: 8081
          name: validator
        
        env:
        # TEE Configuration
        - name: TEE_MODE
          value: "production"
        - name: PHALA_DEPLOYMENT
          value: "true"
        - name: PHALA_API_KEY
          valueFrom:
            secretKeyRef:
              name: phala-secrets
              key: api-key
        
        # Blockchain Configuration
        - name: RPC_URL
          valueFrom:
            configMapKeyRef:
              name: erc8004-config
              key: rpc-url
        - name: CHAIN_ID
          value: "84532"
        
        # ERC-8004 Contracts
        - name: IDENTITY_REGISTRY_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: erc8004-config
              key: identity-registry
        - name: VALIDATION_REGISTRY_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: erc8004-config
              key: validation-registry
        
        # Enhanced AI Configuration
        - name: GROK_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: grok-key
        - name: XAI_API_KEY  # XAI SDK compatibility
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: grok-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: openai-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: anthropic-key
        
        # AI Model Selection
        - name: GROK_FAST_MODEL
          value: "grok-3-mini"
        - name: GROK_STANDARD_MODEL
          value: "grok-3"
        - name: CLAUDE_MODEL
          value: "claude-3-5-sonnet-20241022"
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        
        # TEE Security Context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10

---
# Service for external access
apiVersion: v1
kind: Service
metadata:
  name: erc8004-service
  labels:
    app: erc8004-a2a
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    name: frontend
  - port: 8080
    targetPort: 8080
    name: api-server
  - port: 8081
    targetPort: 8081
    name: validator
  selector:
    app: erc8004-a2a

---
# Configuration Map
apiVersion: v1
kind: ConfigMap
metadata:
  name: erc8004-config
data:
  rpc-url: "https://lb.drpc.org/base-sepolia/YOUR_DRPC_KEY_HERE"
  identity-registry: "0x35656CaD817aD468260dE1bA029fF919E5a40f75"
  reputation-registry: "0x5796Cf09CF7E0F27A6Fb1489a7e5f9414f95F17B"
  validation-registry: "0x6731b3be764B33a4E94D148410f1f551CE91dA61"

---
# Secrets template (create with kubectl)
# kubectl create secret generic phala-secrets --from-literal=api-key=YOUR_PHALA_API_KEY
# kubectl create secret generic ai-secrets \
#   --from-literal=grok-key=YOUR_GROK_KEY \
#   --from-literal=openai-key=YOUR_OPENAI_KEY \
#   --from-literal=anthropic-key=YOUR_ANTHROPIC_KEY

# Usage:
# 1. Replace YOUR_*_HERE with actual values
# 2. Create secrets: kubectl create secret generic phala-secrets --from-literal=api-key=YOUR_PHALA_API_KEY
# 3. Deploy: kubectl apply -f phala-deployment.yml
# 4. Access: kubectl get services erc8004-service
